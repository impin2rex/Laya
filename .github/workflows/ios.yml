name: iOS IPA

on:
  push:
    branches: [feat/ios]
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - 'sharedUi/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Runner has an Android SDK; point at nothing so settings.gradle.kts only configures KMP modules.
      ANDROID_HOME: /nonexistent
      ANDROID_SDK_ROOT: /nonexistent

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Kotlin/Native toolchain
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate Xcode project
      run: |
        brew install xcodegen
        cd iosApp && xcodegen generate

    - name: Build app (unsigned)
      run: |
        xcodebuild \
          -project iosApp/iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -derivedDataPath build/dd \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    # installd rejects a bundle with no signature; Sideloadly/AltStore re-sign it.
    - name: Ad-hoc sign
      run: |
        APP=build/dd/Build/Products/Release-iphoneos/Laya.app
        find "$APP" -type d -empty -delete
        codesign --force --sign - --timestamp=none --generate-entitlement-der "$APP"
        codesign --verify --strict --verbose=2 "$APP"

    - name: Package .ipa
      run: |
        mkdir -p build/ipa/Payload
        cp -R build/dd/Build/Products/Release-iphoneos/Laya.app build/ipa/Payload/
        cd build/ipa && zip -qry ../Laya.ipa Payload

    - uses: actions/upload-artifact@v4
      with:
        name: Laya-ipa
        path: build/Laya.ipa
        retention-days: 30
