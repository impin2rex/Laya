name: Windows x64 EXE

# The Windows installer on every push to development, the way macos-dmg.yml
# builds the DMG — an artifact to test from, not a release. release.yml is
# still the one that publishes, from a version tag.
on:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-exe:
    # jpackage only packages for the OS it runs on, so the .exe has to be
    # built on Windows. The smtc DLL (WinRT media controls) also needs MSVC,
    # which only this runner has.
    runs-on: windows-latest
    env:
      LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
      SIGNATURE_API_URL: ${{ secrets.SIGNATURE_API_URL }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: gradle/actions/setup-gradle@v4

    # jpackage builds the .exe installer with WiX 3.
    - name: WiX Toolset 3
      shell: pwsh
      run: |
        $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
        Invoke-WebRequest -Uri $url -OutFile wix.zip
        Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
        "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Same number the Android build ships, so both artifacts from one push match.
    - name: Work out the version
      id: version
      shell: bash
      run: |
        version=$(sed -n 's/.*extra\["layaVersionName"\] = "\(.*\)".*/\1/p' build.gradle.kts | head -1)
        echo "value=$version" >> "$GITHUB_OUTPUT"
        echo "Building $version"

    - name: Tests
      run: .\gradlew.bat :shared:jvmTest :desktopApp:test "-Playa.version=${{ steps.version.outputs.value }}"

    # createDistributable alongside, as in release.yml: packageExe alone leaves
    # no app image at binaries/main/app, which the check below reads the jar from.
    - name: Build EXE
      run: .\gradlew.bat :desktopApp:packageExe :desktopApp:createDistributable "-Playa.version=${{ steps.version.outputs.value }}"

    # A build that silently drops a native piece still produces an .exe; this
    # is what says the Automix analyser and media controls made it in.
    - name: The analyser and models are in the jar
      shell: bash
      run: |
        jar=$(ls desktopApp/build/compose/binaries/main/app/Laya/app/desktopApp*.jar)
        jar tf "$jar" | grep -q 'native/laya_analysis.dll'
        jar tf "$jar" | grep -q 'models/.*\.onnx'
        jar tf "$jar" | grep -q 'native/laya_smtc.dll'

    - name: Name the installer
      shell: pwsh
      run: |
        $v = "${{ steps.version.outputs.value }}"
        New-Item -ItemType Directory -Force dist | Out-Null
        Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/Laya-$v-windows-x64-setup.exe"
        Get-ChildItem dist | Format-Table Name, Length

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: laya-windows-x64-exe
        path: dist/*.exe
        if-no-files-found: error
