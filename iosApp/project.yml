# XcodeGen spec. CI runs `xcodegen generate`; no .pbxproj is committed.
name: iosApp
options:
  deploymentTarget:
    iOS: "16.0"
  # Google Cast has no Swift package: fetch the official, checksummed xcframework into Vendor/ (run from iosApp/).
  preGenCommand: sh scripts/fetch-cast-sdk.sh
settings:
  base:
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.19.2
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
      # Neural karaoke's model, the same file Android bundles.
      - path: ../app/src/main/assets/UVR_MDXNET_9482.onnx
        buildPhase: resources
    dependencies:
      - package: onnxruntime
        product: onnxruntime
      - framework: Vendor/GoogleCast.xcframework
        embed: true
    settings:
      base:
        # Checked-in plist; XcodeGen's `info:` key would overwrite it.
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: Laya
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.music.laya
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../sharedUi/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework LayaKit"
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          # Xcode passes no JAVA_HOME; Gradle 8.11 can't run on the newest JDKs.
          if [ -z "$JAVA_HOME" ]; then export JAVA_HOME="$(/usr/libexec/java_home -v 21)"; fi
          ./gradlew :sharedUi:embedAndSignAppleFrameworkForXcode
